[project]
name = "nyc-taxi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "altair>=6.2.2",
    "fastapi>=0.139.2",
    "geopandas>=1.1.4",
    "lightgbm>=4.6.0",
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pydantic-settings>=2.14.2",
    "requests>=2.34.2",
    "streamlit>=1.60.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # TestClient do FastAPI (starlette) roda sobre httpx; a versão 1 já sai
    # com DeprecationWarning, então entra a 2 direto.
    "httpx2>=2.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]  # "." para `import api` sob pytest
testpaths = ["tests"]
