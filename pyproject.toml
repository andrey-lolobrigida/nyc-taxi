[project]
name = "nyc-taxi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.1.4",
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
